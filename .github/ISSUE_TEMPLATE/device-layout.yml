name: Device layout
description: An xquirks definition steps back for your device because the device lacks an endpoint or cluster it needs.
title: "Device layout: <manufacturer> <model>"
labels: [device layout]
body:
  - type: markdown
    attributes:
      value: The log of Home Assistant names the definition and the reason ([README, "A device gets no definition"](https://github.com/jabla/xquirks#a-device-gets-no-definition)). The device signature below shows which endpoints and clusters your device has. Downloaded diagnostics hold more, such as the network address and attribute values. The issue shows everything you paste.
  - type: input
    id: file
    attributes:
      label: Definition
      placeholder: <vendor>_<model> (revision 1a2b3c4d)
    validations:
      required: true
  - type: input
    id: reason
    attributes:
      label: Why it does not fit
      placeholder: "it has no endpoint 1"
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
  - type: textarea
    id: signature
    attributes:
      label: Device signature
      description: "The signature as the device joined, before any quirk: the device's diagnostics hold it (the device's page > three-dot menu > Download diagnostics). For a device that runs no quirk, Manage Zigbee device > Signature in that menu is enough."
      render: json
    validations:
      required: true
