name: Device test (verify a quirk)
description: You own the device and compared its values with the quirk, with the device check of the xquirks integration or with tools/probe.py.
title: "Verify: <vendor> <model>"
labels: [verify]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Check the fields for anything you do not want to share.
  - type: input
    id: file
    attributes:
      label: Quirk file
      placeholder: quirks/z2m_<vendor>_<model>.py
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: The `Revision:` line at the top of the quirk file or `revision` in the diagnostics of the xquirks integration (Settings > Devices & services > xquirks > three-dot menu > Download diagnostics).
      placeholder: 1a2b3c4d
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.3"
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Device variant
      description: The device check of the xquirks integration fills this in with the end of the title (manufacturer, model, firmware and the quirk file's key). Without the integration, leave it empty.
      placeholder: "[_TZE200_abcd1234 | TS0601 | 0x00000046 | 1a2b3c4d]"
  - type: textarea
    id: report
    attributes:
      label: Report and diagnostics
      description: The device check of the xquirks integration fills this in. With the probe ([CONTRIBUTING.md, "A device test"](https://github.com/jabla/xquirks/blob/main/CONTRIBUTING.md#a-device-test-verified)), drop report.md and diagnostics.json here.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything that did not match
      description: Entity, what HA shows, what the device shows or does.
