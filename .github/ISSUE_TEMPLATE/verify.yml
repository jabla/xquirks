name: Device test (verify a quirk)
description: You own the device and compared its values with the quirk, with the device check of the xquirks integration or with tools/probe.py.
title: "Verify: <vendor> <model>"
labels: [verify]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. The easiest way is **Check a device** in Home Assistant (Settings > Devices & services > xquirks > Configure): it asks the device for its values, you mark what matches the device, then it opens this form filled in. Its report names no address and none of the names you gave. Without the integration, run the probe (see [CONTRIBUTING.md, "A device test"](https://github.com/jabla/xquirks/blob/main/CONTRIBUTING.md#a-device-test-verified)), tick the values in `probe-report/report.md` that match the device (its display, its app or what it does), then attach `report.md` and `diagnostics.json` below. The probe removes IEEE addresses. Check everything for anything else you do not want to share.
  - type: input
    id: file
    attributes:
      label: Quirk file
      placeholder: quirks/z2m_<vendor>_<model>.py
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: The `Revision:` line at the top of the quirk file or `revision` in the diagnostics of the xquirks integration (Settings > Devices & services > xquirks > three-dot menu > Download diagnostics).
      placeholder: 1a2b3c4d
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.3"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Probe report and diagnostics
      description: The device check of the xquirks integration fills this in. With the probe, drop report.md and diagnostics.json here.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything that did not match
      description: Entity, what HA shows, what the device shows or does.
