name: Wrong or missing value
description: A device on an xquirks definition shows a wrong value, misses an entity or a setting does not stick.
title: "<manufacturer> <model>: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: The button "Report a problem (xquirks)" on the device's page fills in this form without the device's address or name. Check the fields for anything you do not want to share.
  - type: input
    id: file
    attributes:
      label: Definition
      description: "`definition` in the diagnostics of xquirks. The device's page shows it as Quirk `xquirks:xquirks:<definition> <revision>`."
      placeholder: <vendor>_<model>
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: "`revision` in the diagnostics of xquirks."
      placeholder: 1a2b3c4d
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: The entity, what Home Assistant shows and what the device's display or app shows at the same time. For a setting, the value you set and what it went back to.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Versions and values in Home Assistant
      description: The button fills this in. Without it, drop the device's diagnostics here (the device's page > three-dot menu > Download diagnostics).
    validations:
      required: true
