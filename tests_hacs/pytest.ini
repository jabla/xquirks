# Tests of the Home Assistant integration in custom_components/, the finder in site/ and tools/.
# Run from the repo root after `pip install -r tests_hacs/requirements.txt`:
#   python -m pytest tests_hacs
[pytest]
# Home Assistant puts its httpx alias in place on import; respx's own plugin would import httpx first.
addopts = -p no:respx
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = ..
testpaths = .
