# Tests of the loader (custom_components/xquirks/loader.py) and of the definition format (FORMAT.md), without Home
# Assistant: ZHA runs the loader inside its custom quirk import. Run from the repo root after
# `pip install -r tests_hacs/requirements.txt`:
#   python -m pytest tests_loader
# XQUIRKS_COST=1 adds the cost benchmark (test_cost.py, its table with -s).
[pytest]
# Without Home Assistant's test plugin (tests_hacs/requirements.txt installs it): its fixtures and checks are for tests
# of Home Assistant.
addopts = -p no:pytest_homeassistant
testpaths = .
